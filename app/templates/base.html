<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ config.APP_NAME }}{% endblock %}</title>
    <meta name="description" content="A modern bridge learning platform built with Flask.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="page-shell">
        <header class="site-header">
            <a class="brand" href="{{ url_for('main.home') }}">{{ config.APP_NAME }}</a>
            <nav class="site-nav" aria-label="Primary">
                <a href="{{ url_for('main.home') }}">Home</a>
                <a href="{{ url_for('courses.index') }}">Courses</a>
                <a href="{{ url_for('auth.index') }}">Members</a>
            </nav>
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>

        <footer class="site-footer">
            <p>Built for focused bridge practice, clear teaching, and future course growth.</p>
        </footer>
    </div>
</body>
</html>
